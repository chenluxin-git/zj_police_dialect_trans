# 生产环境前端站点配置（浙警智治上架用；挂载为 /etc/nginx/conf.d/default.conf）
#
# 与 web/nginx.conf 的区别：
# 1. 访问日志按**智慧运维规范**结构化输出（含耗时、真实 IP、上游信息），供 SLS / AIOS-agent 采集
# 2. 明确 443 为唯一入口、HSTS、附件下载与录音上传的体积/超时
# 3. 静态资源长缓存（带 hash 的产物），index.html 不缓存（避免发版后白屏）
# 4. 预留 /jzpf/ 子路径部署示例（默认注释，按平台给的实际路径启用）
#
# 证书：把正式证书放到 deploy/certs/ 下并改下面两行路径；
#      自签证书仅限内网联调（浏览器需手动信任，麦克风录音要求 HTTPS 安全上下文）

# ---------- 智慧运维访问日志（结构化；SLS / AIOS-agent 采集） ----------
# 字段顺序：真实IP | 时间 | 请求 | 状态 | 字节 | 来源 | UA | 耗时 | 真实来源链 | 上游耗时 | 上游地址 | 上游状态
# 注意：$request_time 与 $upstream_* 是智慧运维要求的"接口耗时/调用结果"来源，不能删
#
# 排障补充字段（内网联调必需，插在行尾以免影响既有采集解析）：
#   trace=$zp_trace          —— 与后端 app.request / 前端错误上报同一个 id，三方对齐
#   rz=$zp_has_usertoken     —— 平台**有没有**带零信任令牌（只看有无，不记值）
#   az=$zp_has_apptoken      —— 同上，应用令牌
#   auth=$zp_has_auth        —— 业务接口有没有带 Authorization
#   uth=$zp_has_uth          —— 业务接口有没有带用户令牌（两者任一即可，便于判断是哪条路进来）
#   ct=$zp_content_type      —— 回调可能是 GET / POST 表单 / POST JSON，先看它
# 这些 map 把"空值"归一成 0/1，否则日志里出现空字段无法区分"没带"和"取不到"。
# map / log_format 是 http 级指令，必须在 server 块外（本文件被 include 在 http 层，置顶即合法；
# 放进 server 块会 nginx: [emerg] "map" directive is not allowed here，web 容器起不来）
map $http_rzzx_usertoken $zp_has_usertoken { default 1; "" 0; }
map $http_rzzx_apptoken  $zp_has_apptoken  { default 1; "" 0; }
map $http_authorization  $zp_has_auth      { default 1; "" 0; }
map $http_utoken         $zp_has_uth       { default 1; "" 0; }
map $http_content_type   $zp_content_type  { default $http_content_type; "" -; }
# trace：优先沿用上游传入的 X-Trace-Id，没有则用 nginx 自己的 request_id
map $http_x_trace_id $zp_trace { default $http_x_trace_id; "" $request_id; }

log_format zhijing '$remote_addr|$time_local|"$request"|$status|$body_bytes_sent|'
                   '"$http_referer"|"$http_user_agent"|$request_time|"$http_x_forwarded_for"|'
                   '$upstream_response_time|$upstream_addr|$upstream_status|'
                   'trace=$zp_trace|rz=$zp_has_usertoken|az=$zp_has_apptoken|'
                   'auth=$zp_has_auth|uth=$zp_has_uth|ct=$zp_content_type';

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # ---------- 证书 ----------
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 公安内网系统，禁止被搜索引擎/外部站点嵌入
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---------- 智慧运维访问日志（map/log_format 定义见文件顶部 http 层） ----------
    access_log /var/log/nginx/access.log zhijing;
    # 联调期把 error 提到 info：能记录 upstream 连接失败、TLS 握手、DNS 解析等细节，
    # 这些正是内网首次部署失败的主因。稳定后可改回 warn。
    error_log  /var/log/nginx/error.log info;

    # 录音上传（webm 原始）+ 音频批量导入，放宽体积与超时
    client_max_body_size 200m;
    client_body_timeout  300s;

    # ---------- 网关错误也返回 JSON 信封 ----------
    # 前端的 axios 拦截器按 {code,msg,data} 解包。nginx 默认返回 HTML 错误页，
    # 前端只能显示"请求失败"，看不出是 502 还是 413，联调时无法定位。
    # 这里统一成信封，并在 msg 里带上状态码，前端提示与日志都能直接看出原因。
    error_page 400 401 403 404 405 408 413 414 429 500 502 503 504 = @json_err;
    location @json_err {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"code":$status,"msg":"网关错误 HTTP $status（来源：nginx）","data":null}';
    }

    # ---------- 后端 API ----------
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 审计 terminalId 依赖这一行（用户域访问数据域会多次代理，须保留整条链，由后端取第一跳）
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # trace 贯穿：把 nginx 的 trace 交给后端，后端复用并回写响应头，
        # 于是「nginx 访问日志 ←→ app.request.log ←→ 前端错误上报」可用同一个 id 串起来
        proxy_set_header X-Trace-Id        $zp_trace;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 导出 ZIP 下载不缓冲，避免大包占满磁盘
        proxy_buffering off;
    }

    # ---------- 静态资源（带 hash，可长缓存） ----------
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ---------- SPA 入口 ----------
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }

    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # ---------- 子路径部署示例（如平台给的是 https://域名/record/） ----------
    # 启用步骤：
    #   1) 前端构建：npm run build -- --base=/record/
    #   2) 后端环境变量：FRONTEND_BASE=/record/（认证回调 302 跳转依赖它）
    #   3) 放开下面整段，并把上面 location / 的内容改成 root 指向同一目录
    #
    # location /record/ {
    #     alias /usr/share/nginx/html/;
    #     try_files $uri $uri/ /record/index.html;
    # }
    # location /record/api/ {
    #     proxy_pass http://backend:8000/api/;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     client_max_body_size 200m;
    #     proxy_read_timeout 300s;
    # }
}
