# ==== zjpdt 方言语料平台 /record/ 子路径接入片段（宝塔） ====
#
# 粘贴位置：宝塔面板 → 网站 → tailect.cn → 设置 → 配置文件
#           （即 /www/server/panel/vhost/nginx/tailect.cn.conf），
#           找到 listen 443 ssl 的 server{}，整段粘贴在**最后一个 } 之前、现有 location 之后**。
#
# 粘贴前务必先备份：cp /www/server/panel/vhost/nginx/tailect.cn.conf{,.bak-zjpdt-$(date +%F)}
# 面板保存时自动 nginx -t + 重载；改坏了用备份还原（这就是"不影响现有站点"的回滚手段）。
#
# 动手前把 <站点根> 替换成实际路径（宝塔默认形如 /www/wwwroot/tailect.cn），
# 前端产物就解压在该目录的 record/ 子目录下（DEPLOY.md §7）。
#
# 三个 location 都带 ^~ 的原因：nginx 里普通前缀 location 会输给任何命中的**正则** location，
# 宝塔站点配置常见 `location ~ .*\.(js|css)?$` 之类的静态缓存/防盗链正则——不带 ^~，
# /record/assets/xxx.js 会被正则抢走并从主站 root 找文件，表现为莫名 404。

# 裸 /record（无斜杠）必须 301：location /record/ 前缀匹配不到它，否则请求落进主站 location /，
# 用户手输 https://tailect.cn/record 会打开主站页面，看起来像"部署坏了"
location = /record { return 301 /record/; }

# API 反代到本机 Docker（只绑了 127.0.0.1:8002）。
# proxy_pass 结尾的 /api/ 是 URI 重写语义（去 /record 前缀），斜杠不能省；
# XFF/X-Real-IP 必须透传——后端审计的 terminalId 取 X-Forwarded-For 第一跳（reqlog 自解析，无需 --proxy-headers）
location ^~ /record/api/ {
    proxy_pass http://127.0.0.1:8002/api/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 200m;         # 录音上传（webm 原始）+ 音频批量导入
    client_body_timeout  300s;
    proxy_read_timeout   300s;
    proxy_send_timeout   300s;
    proxy_buffering off;               # 导出 ZIP 流式下载不落盘缓冲
}

# 带 hash 的静态资源：长缓存
location ^~ /record/assets/ {
    root <站点根>;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
}

# SPA 入口回退：物理目录与 URI 前缀同名（record/），root 天然对齐，不用 alias
# （alias + try_files 是 nginx 多年未修的坑组合，别碰）
location ^~ /record/ {
    root <站点根>;
    try_files $uri $uri/ /record/index.html;
    # index.html 不缓存，避免发新版后浏览器用旧入口白屏
    add_header Cache-Control "no-store";
    # 注：location 内一旦出现 add_header，server 级的响应头（如主站安全头）在这些响应上不再继承；
    #     若主站在 server{} 配了 HSTS 等头且需要覆盖 /record/，把同样的头在本段重声明一份即可
}
