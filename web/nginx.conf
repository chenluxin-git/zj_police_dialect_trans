# 前端 nginx 站点配置（镜像内默认配置，挂载为 /etc/nginx/conf.d/default.conf）
#
# 两种使用方式：
# 1) 直接用镜像（docker compose 未挂载外部配置时）：本文件生效
# 2) 挂载 deploy/nginx.zhijing.conf 覆盖本文件：上架版（本文件内容是其子集）
# 两份都保留智慧运维要求的访问日志字段（$request_time / $upstream_* / XFF），不要删。

server {
    listen 80;
    server_name _;
    # 80 强跳 443（麦克风采集 MediaRecorder 需要安全上下文，必须 HTTPS）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # 自签证书由 deploy/certs/ 挂载（生成命令见 deploy/README.md）
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 智慧运维访问日志（结构化；$request_time 与 $upstream_* 为其要求的耗时/结果字段）
    log_format zhijing '$remote_addr|$time_local|"$request"|$status|$body_bytes_sent|'
                       '"$http_referer"|"$http_user_agent"|$request_time|"$http_x_forwarded_for"|'
                       '$upstream_response_time|$upstream_addr|$upstream_status';
    access_log /var/log/nginx/access.log zhijing;
    error_log  /var/log/nginx/error.log warn;

    # 录音上传 / 音频批量导入 / 转译 100MB 视频放宽请求体（multipart 有开销，留倍余量）
    client_max_body_size 200m;

    # API 反代到 backend 容器（compose 网络内 DNS）
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 审计 terminalId 依赖这一行（保留整条链，由后端取第一跳）
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA 静态资源 + 前端路由回退
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}
