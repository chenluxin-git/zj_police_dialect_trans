<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注册 · 浙江公安方言语料采集平台</title>
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>
<main class="zp-auth">
  <!-- 左：身份面板（与登录一致） -->
  <section class="zp-auth-panel">
    <svg class="zp-emblem" viewBox="0 0 48 56" fill="none" aria-hidden="true">
      <path d="M24 2 44 8v18c0 14-9 23-20 28C13 49 4 40 4 26V8L24 2z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M24 17l2.5 5.1 5.6.8-4 4 .9 5.6L24 29.9l-5 2.6.9-5.6-4-4 5.6-.8L24 17z" fill="currentColor"/>
    </svg>
    <h1>浙江公安<br>方言语料采集平台</h1>
    <p class="org">浙江省公安厅 · 方言转译大模型语料建设</p>
    <svg class="wave-svg" viewBox="0 0 520 72" fill="none" aria-hidden="true">
      <polyline points="0,36 40,36 55,20 70,50 85,28 100,44 115,36 150,36 165,10 180,60 195,22 210,48 225,34 260,36 275,16 290,54 305,26 320,46 335,36 370,36 385,18 400,56 415,24 430,44 445,36 520,36"
        stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    <div class="sample">
      <p class="d">「侬是啥地方人？」</p>
      <p class="m">吴语 · 释义：你是哪里人</p>
    </div>
    <div class="foot">
      <span>公安内网系统 · 注意保密</span>
      <span>浙江省公安厅</span>
    </div>
  </section>

  <!-- 右：注册表单 -->
  <section class="zp-auth-form">
    <h2>注册账号</h2>
    <p class="lead">请如实填写姓名与所属单位，便于任务统计</p>

    <div class="zp-field">
      <label for="phone">手机号<span class="req">*</span></label>
      <input class="zp-input" id="phone" type="tel" maxlength="11" placeholder="用于登录与联系">
      <p class="zp-hint zp-hint--warn">手机号一旦注册不可更改</p>
    </div>

    <div class="zp-form-row">
      <div class="zp-field">
        <label for="pwd">设置密码<span class="req">*</span></label>
        <input class="zp-input" id="pwd" type="password" placeholder="8-20 位">
      </div>
      <div class="zp-field">
        <label for="pwd2">确认密码<span class="req">*</span></label>
        <input class="zp-input" id="pwd2" type="password" placeholder="再次输入">
      </div>
    </div>

    <div class="zp-field">
      <label for="name">真实姓名<span class="req">*</span></label>
      <input class="zp-input" id="name" type="text" placeholder="如不便透露可填写「匿名」">
    </div>

    <div class="zp-form-row">
      <div class="zp-field">
        <label for="city">所属地市<span class="req">*</span></label>
        <select class="zp-select" id="city">
          <option>浙江省</option>
        </select>
      </div>
      <div class="zp-field">
        <label for="area">所属区县<span class="req">*</span></label>
        <select class="zp-select" id="area">
          <option>请选择</option>
          <option selected>台州市</option>
          <option>杭州市</option>
          <option>舟山市</option>
        </select>
      </div>
      <div class="zp-field">
        <label for="town">区县<span class="req">*</span></label>
        <select class="zp-select" id="town">
          <option>请选择</option>
          <option selected>临海市</option>
          <option>仙居县</option>
          <option>椒江区</option>
        </select>
      </div>
    </div>

    <div class="zp-field">
      <label for="station">所属派出所<span class="req">*</span></label>
      <select class="zp-select" id="station">
        <option>请选择</option>
        <option selected>临海市公安局××派出所</option>
        <option>临海市公安局杜桥派出所</option>
      </select>
    </div>

    <button class="zp-btn zp-btn--primary zp-btn--lg zp-btn--block" data-toast="演示：注册成功并登录">注 册</button>
    <p class="zp-center zp-mt-16 zp-text-3">已有账号？<a href="login.html">返回登录</a></p>
  </section>
</main>
</body>
</html>
